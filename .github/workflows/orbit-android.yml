name: Orbit Android
on:
  workflow_dispatch:
  push:
    branches: [codex/game-hub-20261027]
    paths: ['game-hub/**', '.github/workflows/orbit-android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug
        working-directory: game-hub
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-debug
          path: game-hub/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
